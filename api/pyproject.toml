[project]
name = "drzamani-api"
version = "1.2.0"
description = "Backend API for the Dr Zamani appointment platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.16.5",
    "email-validator==2.2.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "jdatetime==5.2.0",
    "openpyxl==3.1.5",
    "pillow==11.3.0",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.43",
    "tzdata>=2025.2",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.uv]
package = false
