[project]
name = "drzamani-api"
version = "1.9.0"
description = "Backend API for the Dr Zamani appointment platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.16.5",
    "email-validator==2.2.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "jdatetime==5.2.0",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "starlette==1.3.1",
    "sqlalchemy==2.0.43",
    "tzdata>=2025.2",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
package = false
