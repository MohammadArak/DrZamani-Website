limit_req_zone $binary_remote_addr zone=drz_otp:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=drz_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=drz_verify:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=drz_public:10m rate=120r/m;

server {
    listen 80;
    server_name drfarzadzamani.ir www.drfarzadzamani.ir;
    return 301 https://drfarzadzamani.ir$request_uri;
}

server {
    listen 443 ssl http2;
    server_name drfarzadzamani.ir;

    root /var/www/drzamani/current/public_html;
    index index.html;

    # Configure the real certificate paths on the VPS.
    ssl_certificate /etc/letsencrypt/live/drfarzadzamani.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drfarzadzamani.ir/privkey.pem;

    # Slightly above the application limit to allow multipart overhead.
    client_max_body_size 11m;
    limit_req_status 429;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    # No application/json: API bodies can carry per-session values, so they stay uncompressed (BREACH).
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain application/xml;
    include /etc/nginx/snippets/drzamani-security-headers.conf;

    # Only explicitly approved publications are public; unknown old articles remain 410.
    location ^~ /articles/ {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }
    location = /articles { return 301 /articles/; }
    location ^~ /media/ {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /api/v1/auth/otp/request {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        limit_req zone=drz_otp burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /api/v1/auth/otp/verify {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        limit_req zone=drz_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /api/v1/staff/auth/login {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        limit_req zone=drz_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /api/v1/staff/auth/captcha {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        limit_req zone=drz_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /api/v1/staff/auth/mfa/verify {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        limit_req zone=drz_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /api/v1/auth/bot/challenge {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        limit_req zone=drz_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /api/v1/realtime {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /api/v1/availability {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        limit_req zone=drz_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location ^~ /api/ {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/drzamani-proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/drzamani-security-headers.conf;
    }

    # Initial public HTML and SEO read the latest clinic row on every request.
    # Activate with the matching API release; assets remain served by Nginx.
    location = / { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }
    location = /index.html { return 301 /; }
    location = /services { return 301 /services/; }
    location ^~ /services/ { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }
    location = /privacy { return 301 /privacy/; }
    location = /privacy/ { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }
    location = /appointment { return 301 /appointment/; }
    location = /staff { return 301 /staff/; }
    location = /staff/index.html { return 301 /staff/; }
    location = /appointment/index.html { return 301 /appointment/; }
    location = /appointment/ { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }
    location = /staff/ { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }
    location = /sitemap.xml { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }
    location = /robots.txt { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }
    location = /404.html { if (-f /var/www/drzamani/maintenance.flag) { return 503; } proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/drzamani-proxy-headers.conf; proxy_set_header Connection ""; }

    location ~* \.(?:webp|png|jpg|jpeg|svg|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/drzamani-security-headers.conf;
    }

    location / {
        if (-f /var/www/drzamani/maintenance.flag) { return 503; }
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/drzamani/shared;
        internal;
    }

}

server {
    listen 443 ssl http2;
    server_name www.drfarzadzamani.ir;
    ssl_certificate /etc/letsencrypt/live/drfarzadzamani.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drfarzadzamani.ir/privkey.pem;
    include /etc/nginx/snippets/drzamani-security-headers.conf;
    return 301 https://drfarzadzamani.ir$request_uri;
}
