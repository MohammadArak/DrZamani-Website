<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>در حال به‌روزرسانی | وبسایت دکتر فرزاد زمانی</title><style>body{margin:0}@font-face{font-family:StatusDana;src:url('/fonts/optimized/dana-regular.woff2') format('woff2');font-display:swap}
