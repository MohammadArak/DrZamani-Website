@font-face{font-family:StatusDana;src:url('/fonts/optimized/dana-regular.woff2') format('woff2');font-display:swap}
.site-status{box-sizing:border-box;min-height:100svh;width:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#284c65 0,transparent 63%),#172638;color:#edf4fa;font-family:StatusDana,Tahoma,sans-serif;text-align:center;line-height:1.8;direction:rtl}

.site-status__symbol{height:clamp(100px,28svh,220px);width:min(100%,400px);margin:12px auto;position:relative;animation:status-float 5s ease-in-out infinite}.site-status__symbol svg{display:block;width:100%;height:100%;overflow:hidden}.site-status--connection .site-status__symbol{animation:none}

.site-status__actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}.site-status__actions a,.site-status__actions button{font:inherit;font-size:14px;line-height:1.8;padding:10px 22px;min-width:140px;border-radius:999px;text-decoration:none;cursor:pointer;border:1px solid #d5ab64;background:linear-gradient(115deg,#eacb91,#cfa054);color:#14273d;transition:transform .2s}.site-status__actions .site-status__secondary{background:transparent;color:#dce8ed;border-color:#adc8d64a}.site-status__actions a:hover,.site-status__actions button:hover{transform:translateY(-2px)}.site-status__actions :focus-visible{outline:3px solid #b2d6e6;outline-offset:5px}
.site-status__preserved{font-size:12px;color:#b2d6e6;margin:10px 0 0}.site-status__credit{margin:14px 0 0}.site-status--overlay{position:fixed;inset:0;z-index:9999;overflow:auto}
@keyframes status-float{50%{transform:translateY(-7px)}}
.connection-window{animation:connection-window 5s ease-in-out infinite;transform-origin:center}.connection-orbit{animation:connection-orbit 24s linear infinite;transform-origin:240px 146px}.connection-plug--left{animation:connection-left 3.8s ease-in-out infinite;transform-origin:120px 210px}.connection-plug--right{animation:connection-right 3.8s ease-in-out infinite;transform-origin:370px 210px}.connection-wave{animation:connection-wave 2.8s ease-in-out infinite}.connection-wave--outer{animation-delay:.4s}.connection-spark{animation:connection-spark 3.8s ease-in-out infinite}.connection-dot{animation:connection-wave 4s ease-in-out infinite}
@keyframes connection-window{50%{transform:translateY(-8px)}}@keyframes connection-orbit{to{transform:rotate(360deg)}}@keyframes connection-left{50%{transform:translate(7px,-7px) rotate(8deg)}}@keyframes connection-right{50%{transform:translate(-7px,4px) rotate(-8deg)}}@keyframes connection-wave{0%,100%{opacity:.2}50%{opacity:1}}@keyframes connection-spark{0%,25%,75%,100%{opacity:.15}50%{opacity:1}}

@media(max-height:650px){.site-status{padding:12px}.site-status__brand img{width:185px;height:58px}.site-status__symbol{height:clamp(80px,22svh,145px);margin:8px auto}.site-status h1{font-size:24px;margin:8px 0}.site-status__actions{margin-top:12px}.site-status__credit{margin-top:8px}}
@media(max-width:380px){.site-status__actions{gap:8px}.site-status__actions a,.site-status__actions button{min-width:0;padding:9px 18px}.site-status__description{font-size:13px}}
@media(prefers-reduced-motion:reduce){.site-status__symbol,.site-status svg *{animation:none!important}.site-status__actions a,.site-status__actions button{transition:none}}
.raviel-credit{display:inline-flex;color:#fddba1!important;font-weight:700;background:linear-gradient(110deg,#ffe4a8 15%,#7ecaff 40%,#f3b654 65%,#ffe4a8 90%);background-size:300%;background-clip:text;-webkit-text-fill-color:transparent;animation:credit-flow 4s ease-in-out infinite}
@keyframes credit-flow{50%{background-position:100%}}
.raviel-credit{font-family:Vazir,sans-serif;align-items:center;gap:8px;padding:8px 12px;font-size:14px;line-height:1.8;text-decoration:none;white-space:nowrap}
.raviel-credit:focus-visible{outline:2px solid #7ecaff;outline-offset:4px;border-radius:6px}
.raviel-credit-footer{display:flex;justify-content:center;align-items:center;padding:12px 16px;background:#293241;direction:rtl}
@media(prefers-reduced-motion:reduce){.raviel-credit{animation:none}}
</style></head><body><main class="site-status site-status--maintenance"><div class="site-status__card"><a class="site-status__brand" href="/"><img src="/img/logo/logo-dark-full.webp" width="320" height="100" alt="وبسایت دکتر فرزاد زمانی"></a><div class="site-status__symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><circle cx="100" cy="100" r="94" fill="#213b55" fill-opacity=".5" stroke="#d5ab64" stroke-opacity=".3"/><circle cx="100" cy="100" r="79" stroke="#b2d6e6" stroke-opacity=".25" stroke-dasharray="3 8"/><path d="M137 66a46 46 0 1 0 4 53" stroke="#b2d6e6" stroke-width="3" stroke-linecap="round"/><path d="M125 57l16 10-14 10" stroke="#d5ab64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="81" y="81" width="38" height="38" rx="10" stroke="#d5ab64" stroke-width="3"/><path d="M92 91v18m16-18v18" stroke="#d5ab64" stroke-width="4" stroke-linecap="round"/></svg></div><p class="site-status__code"></p><p class="site-status__label">کمی مکث، برای تجربه‌ای بهتر</p><h1>در حال به‌روزرسانی</h1><p class="site-status__description">در حال آماده‌کردن نسخهٔ تازهٔ سایت هستیم. کمی بعد دوباره به ما سر بزنید.</p><nav class="site-status__actions" aria-label="ادامهٔ مسیر"><a href="">تلاش دوباره</a><a class="site-status__secondary" href="/">صفحه اصلی</a></nav><footer class="site-status__credit"><a class="raviel-credit" href="https://raviel.ir" target="_blank" rel="noopener noreferrer">طراحی و توسعه توسط Raviel</a></footer></div></main></body></html>
