proxy_http_version 1.1;
# API query strings may contain patient searches. Keep them out of access logs
# and routine proxy error logs; monitor status/latency with redacted telemetry.
access_log off;
error_log stderr crit;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Discard untrusted client input. If Cloudflare is used, configure real_ip only
# for its verified source ranges before relying on $remote_addr for rate limits.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# The API also protects direct requests; Nginx supplies one copy at the edge.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_connect_timeout 5s;
proxy_read_timeout 75s;
